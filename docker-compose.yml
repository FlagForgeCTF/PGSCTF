name: pgsctf

services:
  pgsctf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-0000000000000000000000000000000000000000}
        GIT_NAME: ${GIT_NAME:-v1.0.0}
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-2026-01-11T00:00:00Z}
    restart: unless-stopped
    ports:
      - "3005:8080"
    env_file:
      - .env
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ConnectionStrings__Database=${DATABASE_URL}
      - ConnectionStrings__RedisCache=redis:6379
      - ContainerProvider__Type=Docker
      - ContainerProvider__DockerConfig__SwarmMode=false
    volumes:
      - pgsctf-data:/app/files
      - pgsctf-logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgsctf
      POSTGRES_PASSWORD: pgsctf
      POSTGRES_DB: pgsctf
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  pgsctf-data:
  pgsctf-logs:
  redis-data:
